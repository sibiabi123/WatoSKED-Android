name: 📱 Build Android APK (WatoSKED)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Compile Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Grant Execute Permissions for Gradlew
        run: chmod +x gradlew || gradle wrapper

      - name: 🏗️ Build Debug & Release APK
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p build_output
          cp app/build/outputs/apk/debug/*.apk build_output/WatoSKED-v1.0.0-debug.apk

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatoSKED-v1.0.0-APK
          path: build_output/WatoSKED-v1.0.0-debug.apk

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: WatoSKED v1.0.0 — Native Android WhatsApp Auto-Scheduler APK
          body: |
            ## 📱 WatoSKED v1.0.0 (Native Android APK)

            SKEDit-style Native Android WhatsApp automation app that works directly on your phone — **no server, no QR code scanning, and no WhatsApp Web required**.

            ### 🌟 Features:
            - 🤖 **Accessibility Automation**: Automatically types and sends scheduled messages via your installed WhatsApp or WhatsApp Business app.
            - ⏰ **Exact Alarm Scheduling**: Uses Android `AlarmManager.setExactAndAllowWhileIdle()` to trigger even in Doze/deep sleep.
            - 🔋 **Battery Optimization Helper**: Prevents background task termination.
            - 🔄 **Auto-Restore on Reboot**: Automatically reschedules pending messages after phone restart.

            ### 📲 How to Install:
            1. Download `WatoSKED-v1.0.0-debug.apk` below directly to your Android device.
            2. Open the file and tap **Install** (allow *Install Unknown Apps* if prompted).
            3. Open **WatoSKED** and enable **Accessibility Service** in Settings.
            4. Schedule your message and let your phone send it automatically!
          files: build_output/WatoSKED-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
