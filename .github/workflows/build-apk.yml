name: 📱 Build Android APK (WatoSKED)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Compile & Dual-Sign Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔐 Generate Release Keystore
        run: |
          keytool -genkeypair \
            -alias watosked \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore app/keystore.jks \
            -storepass watosked123 \
            -keypass watosked123 \
            -dname "CN=WatoSKED, OU=Automation, O=SibiAbi, L=TamilNadu, C=IN"

      - name: 🏗️ Build Dual-Signed Release APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          arguments: assembleRelease --stacktrace

      - name: 📦 Copy APK to Output
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/*.apk build_output/WatoSKED-v1.2.0.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatoSKED-v1.2.0-APK
          path: build_output/WatoSKED-v1.2.0.apk

      - name: 🚀 Publish GitHub Release v1.2.0
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          name: WatoSKED v1.2.0 — Universal Dual-Signed Android APK
          body: |
            ## 📱 WatoSKED v1.2.0 (Universal Signed APK)

            SKEDit-style Native Android WhatsApp automation app that works directly on your phone — **no server, no QR code scanning, and no WhatsApp Web required**.

            ### 🔧 What's New in v1.2.0:
            - 🔑 **Dual-Signed (v1 + v2 Signature Scheme)**: Eliminates "App not installed" / Package Installer verification errors on all Android devices (Samsung, Xiaomi, Oppo, Vivo, OnePlus, Google Pixel).
            - 🌍 **Universal Compatibility**: `minSdk 21` (supports all Android versions from Android 5.0 to Android 15).
            - 📦 **MultiDex Enabled**: Resolves 64K method index limit on package installer.
            - 🔒 **Lockscreen Auto-Unlock**: Supports PIN auto-entry and swipe-to-unlock dismissal.

            ### 📲 How to Install:
            1. Download `WatoSKED-v1.2.0.apk` below directly to your phone.
            2. Open the file and tap **Install**.
            3. If Google Play Protect shows a popup, tap **"More details" ➔ "Install anyway"**.
            4. Open **WatoSKED** and enable Accessibility Service in Settings.
          files: build_output/WatoSKED-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
