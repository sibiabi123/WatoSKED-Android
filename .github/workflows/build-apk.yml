name: "📱 Build Android APK (WatoSKED)"

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: "🔨 Compile & Dual-Sign Android APK"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "☕ Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "🤖 Set up Android SDK"
        uses: android-actions/setup-android@v3

      - name: "🔐 Generate Release Keystore"
        run: |
          keytool -genkey -v \
            -keystore app/keystore.jks \
            -alias watosked \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass watosked123 \
            -keypass watosked123 \
            -dname "CN=WatoSKED, OU=Mobile, O=sibiabi123, L=Chennai, ST=TN, C=IN"

      - name: "🏗️ Build Dual-Signed Release APK"
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          arguments: assembleRelease --stacktrace

      - name: "📦 Copy APK to Output"
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/*.apk build_output/WatoSKED-v2.0.0.apk

      - name: "📤 Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: WatoSKED-v2.0.0-APK
          path: build_output/WatoSKED-v2.0.0.apk

      - name: "🚀 Publish GitHub Release v2.0.0"
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0
          name: "WatoSKED v2.0.0 — Complete SKEDit Alternative"
          body: |
            ## 📱 WatoSKED v2.0.0 — Full-Featured WhatsApp Auto-Scheduler

            Complete production rebuild. Works directly on your own WhatsApp — no WhatsApp Web, no QR code.

            ### 🆕 What's New in v2.0:
            - 🔁 **Repeat Messages** — Daily / Weekly / Custom Weekdays (Mon-Sun picker)
            - 👥 **Contact Picker** — Select from phone contacts directly
            - 📝 **Message Templates** — Save & reuse your favourite messages
            - 💼 **WhatsApp Business Support** — Toggle between Personal & Business accounts
            - ✏️ **Edit / Cancel Schedules** — Full management of pending messages
            - 📜 **Send History** tab — SENT / FAILED log with timestamps
            - 🗂️ **Bottom Navigation** — Schedule / Pending / History / Settings
            - 🔔 **Send Confirmation Notification**
            - ⚡ **Persistent Background Service** — Survives battery optimization
            - 🔄 **3 Auto-Retry Logic** — Retries if WhatsApp not fully loaded
            - 🔒 **Lockscreen Auto-Unlock** — PIN bypass like SKEDit
            - 🌐 **Android 5.0 to 15** support (minSdk 21)

            ### 📲 How to Install:
            1. Download **WatoSKED-v2.0.0.apk** below
            2. Open Downloads → Tap the APK → Install
            3. If Play Protect shows warning: tap **OK** → go to Settings → Apps → WatoSKED → 3 dots → **Allow Restricted Settings**
            4. Open WatoSKED → **Settings tab** → Enable Accessibility Service
            5. Schedule your first message and watch it send automatically!
          files: build_output/WatoSKED-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}